<header class="site-header">
  <nav class="nav container" aria-label="Main navigation">
    <a href="{{ url_for('articles.index') }}" class="logo">hummingbird</a>
    <div class="nav-items">
      <a href="{{ url_for('articles.index') }}" class="nav-item">Home</a>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('articles.new_article') }}" class="nav-item">New Article</a>
      {% endif %}
    </div>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('users.logout') }}" class="nav-button">Log out</a>
    {% else %}
      <button type="button" class="nav-button" data-open-auth>Log in</button>
    {% endif %}
  </nav>
</header>
