server {
    listen 80;
    listen [::]:80;
    server_name hummingbird.chirp.blog;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hummingbird-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://hummingbird.chirp.blog$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hummingbird.chirp.blog;

    ssl_certificate /etc/letsencrypt/live/hummingbird.chirp.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hummingbird.chirp.blog/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
