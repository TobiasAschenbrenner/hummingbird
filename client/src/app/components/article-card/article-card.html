<article>
  @if (article().coverImage; as cover) {
    <img
      class="cover-image"
      [src]="cover.url"
      [width]="cover.width"
      [height]="cover.height"
      alt=""
      loading="lazy"
      decoding="async"
    />
  }
  <p class="category">{{ article().category.name }}</p>
  <h3>
    <a [routerLink]="['/articles', article().slug]" [queryParams]="listQuery()">{{
      article().title
    }}</a>
  </h3>
  <p class="description">{{ article().description }}</p>
  <app-article-metadata [article]="article()" />
  <app-tag-list [tags]="article().tags" />
</article>
