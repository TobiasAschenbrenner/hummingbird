<form
  class="filters"
  [formGroup]="form"
  (ngSubmit)="apply()"
  aria-label="Search and filter articles"
>
  <div class="field search-field">
    <label for="article-search">Search articles</label>
    <input
      id="article-search"
      name="q"
      type="search"
      formControlName="q"
      maxlength="200"
      placeholder="Title or description"
      aria-describedby="search-help"
    />
    <small id="search-help">Up to 100 characters. Searches titles and descriptions.</small>
  </div>
  <div class="field">
    <label for="category-filter">Category</label>
    <select id="category-filter" name="category" formControlName="category">
      <option value="">All categories</option>
      @if (missingOption('categories', form.controls.category.value)) {
        <option [value]="form.controls.category.value">
          Unavailable category ({{ form.controls.category.value }})
        </option>
      }
      @for (category of options().categories; track category.id) {
        <option [value]="category.slug">{{ category.name }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="tag-filter">Tag</label>
    <select id="tag-filter" name="tag" formControlName="tag">
      <option value="">All tags</option>
      @if (missingOption('tags', form.controls.tag.value)) {
        <option [value]="form.controls.tag.value">
          Unavailable tag ({{ form.controls.tag.value }})
        </option>
      }
      @for (tag of options().tags; track tag.id) {
        <option [value]="tag.slug">{{ tag.name }}</option>
      }
    </select>
  </div>
  <div class="actions">
    <button type="submit" class="button">Apply filters</button>
    <button type="button" class="clear" (click)="clear()">Clear filters</button>
  </div>
</form>
@if (message()) {
  <p role="alert">{{ message() }}</p>
}
@if (status() === 'loading') {
  <p role="status">Loading filter options…</p>
} @else if (status() === 'error') {
  <p role="alert">We couldn’t load filter options. Search is still available.</p>
  <button type="button" class="button" (click)="loadOptions()">Retry filter options</button>
}
